spring.application.name=apirest

spring.datasource.url=jdbc:postgresql://localhost:5432/apirest
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.data.web.pageable.max-page-size=100

# API externe de taux de change
exchange.api.base-url=https://api.frankfurter.dev/v1
#exchange.api.base-url=http://localhost:9999
exchange.api.timeout-ms=3000
exchange.api.max-attempts=3
exchange.api.backoff-ms=500

# Uniquement si Caffeine est a ajouter
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=10m

